<title>Lift Log</title>
<style>
/* Layout: single narrow column, phone first. Four tabs (Today, Plan, Calendar, History) in a fixed dock that also carries the rest timer.
   Look: chalk-grey gym floor, navy-black ink, one plate-orange accent, condensed industrial display type.
   All type is in rem so the Text size setting scales everything. */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --field:#F3F5F8; --ink:#12161C; --muted:#586272; --line:#D6DBE2;
  --accent:#D63E0F; --on-accent:#FFFFFF; --accent-ink:#B8330A; --accent-soft:#FBE6DE;
  --ok:#1F7A4D; --on-ok:#FFFFFF; --danger:#B3261E;
  --font-display:'Big Shoulders Display','Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101318; --surface:#181C23; --field:#0F1217; --ink:#E9EDF2; --muted:#9AA5B3; --line:#2A313B;
    --accent:#FF7448; --on-accent:#1A0B05; --accent-ink:#FF8A64; --accent-soft:#33190F;
    --ok:#4CC38A; --on-ok:#07140D; --danger:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#181C23; --field:#0F1217; --ink:#E9EDF2; --muted:#9AA5B3; --line:#2A313B;
  --accent:#FF7448; --on-accent:#1A0B05; --accent-ink:#FF8A64; --accent-soft:#33190F;
  --ok:#4CC38A; --on-ok:#07140D; --danger:#FF8A80; color-scheme:dark;
}
/* Higher contrast (setting, or the device asks for it) */
:root.hc{--muted:#2C3440;--line:#6C7683;--accent:#B83208;--accent-ink:#8F2406;--danger:#8F1A12}
@media (prefers-color-scheme: dark){
  :root.hc:not([data-theme="light"]){--muted:#CBD3DD;--line:#8693A3;--accent:#FF8A62;--accent-ink:#FFA283;--danger:#FFA39B}
}
:root[data-theme="dark"].hc{--muted:#CBD3DD;--line:#8693A3;--accent:#FF8A62;--accent-ink:#FFA283;--danger:#FFA39B}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:1rem; line-height:1.45;
  padding-block:10px 130px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:640px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:16px;top:-120px;z-index:30;min-height:44px;padding:0 16px;border-radius:10px;border:2px solid var(--accent);background:var(--surface);color:var(--ink);font:700 1rem var(--font-body)}
.skip:focus{top:max(8px,env(safe-area-inset-top,0px))}
main{display:block}
main:focus{outline:none}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:8px 16px}
.brand{font:800 1.875rem/1 var(--font-display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.status{font-size:.8125rem;color:var(--muted);text-align:right}
h2{font:800 1.625rem/1.05 var(--font-display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px;text-wrap:balance}
h3{font:700 1.0625rem/1.25 var(--font-body);margin:0}
.sub{color:var(--muted);margin:0 0 14px;font-size:.9375rem}
.stack{display:flex;flex-direction:column;gap:10px}
.rowend{display:flex;justify-content:flex-start;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font-family:inherit}
.btn{font:600 1rem var(--font-body);min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn[aria-disabled="true"]{opacity:.7;cursor:default}
.link{background:none;border:0;color:var(--accent-ink);font:600 .9375rem var(--font-body);padding:10px 0;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.mini{min-height:44px;min-width:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:600 .875rem var(--font-body);cursor:pointer}
.mini.danger{color:var(--danger)}
.icon{width:44px;height:44px;border:0;background:transparent;color:var(--muted);font-size:1.375rem;line-height:1;cursor:pointer;border-radius:8px;flex:none}
input,textarea,select{font:inherit;font-size:1rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:0 10px;width:100%;min-width:0}
textarea{padding:10px;min-height:76px;resize:vertical}
::placeholder{color:var(--muted);opacity:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.flash{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:12px 14px;margin:0 0 16px;font-weight:600}
.msg{color:var(--danger);font-weight:700;margin:10px 0 0}
.hint{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:.9375rem}

/* Start list */
.day{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;min-height:68px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.day.next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dname{display:block;font:700 1.375rem/1.1 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.dmeta{display:block;font-size:.875rem;color:var(--muted);margin-top:2px}
.tag{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.go{color:var(--muted);font-size:1.625rem}

/* Active workout */
.sess-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.where{display:block;margin-bottom:4px}
.lbl{display:block;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.target{margin:2px 0 0;font-size:.875rem;color:var(--muted)}
.last{margin:8px 0 0;font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.last:empty{display:none}
.e1{color:var(--ink);font-weight:600;margin-top:4px}
.sethead,.setrow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 48px 40px;gap:8px;align-items:center}
.sethead{margin-top:12px}
.sethead span{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.setrow{margin-top:8px;font-variant-numeric:tabular-nums}
.sn{font-weight:700;color:var(--muted);text-align:center}
.setrow input{text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.chk{width:48px;height:44px;border-radius:8px;border:2px solid var(--line);background:var(--field);color:var(--muted);font-size:1.25rem;cursor:pointer}
.setrow.done .chk{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.setrow .icon{width:40px;height:44px;font-size:1.25rem}
.exfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.restfld{display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--muted);font-weight:600}
.restfld input{width:4.75rem;text-align:center;font-weight:600}
.addex{display:flex;gap:8px;margin-top:16px}
.addex .btn{flex:none;min-height:44px}
.fin{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.fin .primary{flex:1 1 200px}

/* Plan */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);min-height:44px;min-width:52px;font:600 .9375rem var(--font-body);cursor:pointer;padding:0 14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.full{display:flex;width:100%;margin:0 0 16px}
.seg.full button{flex:1;min-width:0}

/* Today card, week strip, suggestions */

.wk.sch .m{border-color:var(--accent)}
.wk.done .m{background:var(--ok);border-color:var(--ok)}
.wk.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* Calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}

.cd.today{border-color:var(--accent)}

.daypanel h2{margin-bottom:2px}

/* Dock: rest timer + tabs */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.timerbar{max-width:640px;margin:0 auto;padding:10px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:relative}
.timerbar .tinfo{min-width:0}
.timerbar .lbl{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.tclock{display:block;font:800 2.25rem/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tclock.go{color:var(--accent-ink)}
.tbtns{display:flex;gap:6px}
.tprog{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.tprog div{height:100%;width:0;background:var(--accent)}
.timerbar.over{background:var(--accent-soft);margin-inline:-16px;padding-inline:16px;max-width:none}
.tabs-in{display:flex;max-width:640px;margin:0 auto}
.tabs button{flex:1;min-width:0;min-height:58px;border:0;border-top:3px solid transparent;background:transparent;color:var(--muted);font:700 1rem var(--font-display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tabs button[aria-current="page"]{color:var(--accent-ink);border-top-color:var(--accent)}
.tabs .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
@media (prefers-reduced-motion:no-preference){.chk,.day,.btn{transition:background .12s,border-color .12s}.tprog div{transition:width .25s linear}}
@media (forced-colors:active){
  .chk,.day,.btn,.mini,.chip,.wk,.cd,.seg button{border:1px solid ButtonText}
  .setrow.done .chk,.seg button[aria-pressed="true"],.chip[aria-pressed="true"],.cd[aria-pressed="true"]{forced-color-adjust:none;background:Highlight;color:HighlightText}
}

<body>


<button class="skip" data-act="skip">Skip to content</button>
<div class="wrap">
  <header class="top">
    <h1 class="brand">Lift Log</h1>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </header>
  <main id="view" tabindex="-1" aria-label="Lift Log content"><p class="sub">Loading your log…</p></main>
</div>
<div class="sr" id="announce" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="dock" id="dock" role="region" aria-label="Rest timer and sections">
  <div class="timerbar" id="timerbar" role="timer" aria-label="Rest timer" hidden></div>
  <nav class="tabs" aria-label="Main sections">
    <div class="tabs-in">
      <button data-act="tab" data-tab="today" id="tab-today">Today</button>
      <button data-act="tab" data-tab="plan" id="tab-plan">Plan</button>
      <button data-act="tab" data-tab="calendar" id="tab-calendar">Calendar</button>
      <button data-act="tab" data-tab="history" id="tab-history">History</button>
    </div>
  </nav>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid8=function(){return Math.random().toString(36).slice(2,9)};
var norm=function(s){return String(s||'').trim().toLowerCase()};

var plan=null, sessions={};
var ui={tab:'today',ptab:'routines',filter:'All',calMonth:null,calDay:null,openDay:null,openRoutine:null,openSess:null,confirm:null,
  chartEx:null,chartMode:'e1rm',volMode:'week',volGroup:'All',flash:'',pflash:'',msg:'',focusSel:null};
var store={mode:'local',planRef:null,sessCol:null,degraded:false};
var installEvt=null, pendingBackup=null;
function isStandalone(){ try{ return !!(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true; }catch(e){ return false; } }

/* ---------- starter plan: your saved workouts (fixed ids so it never needs saving until edited) ---------- */
var TAGS=['Push','Pull','Legs','Upper','Lower','Full body','Chest','Back','Shoulders','Arms','Glutes','Abs'];
var STARTER_ROUTINES=[
  {id:'r1',name:'Push / Pull / Legs x2',dayIds:['w15','w4','w10','w16','w13','w12']},
  {id:'r2',name:'Push / Pull / Legs',dayIds:['w15','w4','w10']},
  {id:'r3',name:'Upper / Lower',dayIds:['w5','w11','w8','w12']},
  {id:'r4',name:'Body-part split',dayIds:['w7','w9','w1','w10','w6']}
];
function seedPlan(){
  var n=0;
  function day(id,name,tag,list){
    return {id:id,name:name,tag:tag,exercises:list.map(function(e){n++;return {id:id+'-'+n,name:e[0],sets:e[1],reps:e[2],note:''}})};
  }
  return {unit:'kg',starter:true,days:[
    day('w1','Boulder Shoulders','Shoulders',[['Machine Shoulder Press',4,'9'],['Cable Lateral Raise',3,'14'],['Lateral Raise',3,'14'],['Reverse Pec Deck',3,'14'],['Front Raise',2,'11'],['Cable Upright Row',3,'11']]),
    day('w2','Back Width','Back',[['Pull-up',4,'8'],['Wide-Grip Lat Pulldown',3,'9'],['Close-Grip Lat Pulldown',3,'11'],['Straight-Arm Pulldown',3,'14'],['Seated Machine Row',3,'11'],['Rear Delt Fly',3,'14']]),
    day('w3','Dumbbell Legs','Legs',[['Goblet Squat',4,'9'],['Dumbbell Romanian Deadlift',3,'9'],['Bulgarian Split Squat',3,'9'],['Dumbbell Walking Lunge',3,'11'],['Dumbbell Calf Raise',3,'14']]),
    day('w4','Pull Day','Pull',[['Lat Pulldown',4,'9'],['Barbell Row',4,'7'],['Seated Cable Row',3,'9'],['Face Pull',3,'14'],['Barbell Curl',3,'9'],['Hammer Curl',3,'11']]),
    day('w5','Upper Body','Upper',[['Barbell Bench Press',4,'7'],['Barbell Row',4,'7'],['Overhead Press',3,'9'],['Lat Pulldown',3,'11'],['Dumbbell Curl',2,'11'],['Tricep Pushdown',2,'11']]),
    day('w6','Abs Circuit','Abs',[['Hanging Leg Raise',3,'11'],['Cable Crunch',3,'14'],['Plank',3,'45 sec'],['Russian Twist',3,'20'],['Bicycle Crunch',3,'20']]),
    day('w7','Chest Day','Chest',[['Barbell Bench Press',4,'7'],['Incline Dumbbell Press',3,'9'],['Machine Chest Press',3,'11'],['Cable Fly',3,'14'],['Pec Deck',2,'14'],['Push-up',2,'14']]),
    day('w8','Quick Upper','Upper',[['Barbell Bench Press',3,'7'],['Lat Pulldown',3,'9'],['Seated Dumbbell Shoulder Press',3,'9'],['Seated Cable Row',3,'11']]),
    day('w9','Back Day','Back',[['Deadlift',3,'5'],['Pull-up',3,'8'],['Barbell Row',3,'9'],['Lat Pulldown',3,'11'],['Seated Cable Row',3,'11']]),
    day('w10','Quad Focus','Legs',[['Hack Squat',4,'9'],['Leg Press',3,'11'],['Bulgarian Split Squat',3,'9'],['Leg Extension',3,'14'],['Seated Calf Raise',3,'14']]),
    day('w11','Lower Strength','Lower',[['Deadlift',4,'5'],['Front Squat',3,'6'],['Leg Press',3,'9'],['Lying Leg Curl',3,'11'],['Standing Calf Raise',3,'13']]),
    day('w12','Lower Hypertrophy','Lower',[['Hack Squat',4,'9'],['Leg Press',3,'11'],['Romanian Deadlift',3,'9'],['Leg Extension',3,'14'],['Seated Leg Curl',3,'11'],['Standing Calf Raise',3,'13']]),
    day('w13','Back & Biceps','Pull',[['Pull-up',4,'8'],['One-Arm Dumbbell Row',3,'9'],['Lat Pulldown',3,'11'],['Straight-Arm Pulldown',3,'14'],['Incline Dumbbell Curl',3,'11'],['Preacher Curl',3,'11']]),
    day('w14','Machine Pull','Pull',[['Lat Pulldown',4,'9'],['Seated Machine Row',3,'9'],['Chest-Supported Row',3,'11'],['Reverse Pec Deck',3,'14'],['Machine Preacher Curl',3,'11'],['Cable Curl',3,'14']]),
    day('w15','Push Day','Push',[['Barbell Bench Press',4,'7'],['Incline Dumbbell Press',3,'9'],['Machine Shoulder Press',3,'9'],['Cable Lateral Raise',3,'14'],['Tricep Pushdown',3,'11'],['Overhead Cable Tricep Extension',3,'11']]),
    day('w16','Upper Chest Focus','Push',[['Incline Barbell Bench Press',4,'7'],['Incline Dumbbell Press',3,'9'],['Low-to-High Cable Fly',3,'14'],['Machine Chest Press',3,'11'],['Dips',2,'10']])
  ]};
}
/* Brings an older saved plan up to date. Returns true when something was added. */
function upgradePlan(){
  var changed=false;
  if(!plan.unit) plan.unit='kg';
  if(!Array.isArray(plan.schedule)||plan.schedule.length!==7) plan.schedule=['','','','','','',''];
  if(!plan.rest||typeof plan.rest!=='object') plan.rest={};
  var st=plan.settings||{}, def={rest:90,timer:true,sound:true,vibrate:true,awake:true,text:100,contrast:false};
  Object.keys(def).forEach(function(k){ if(st[k]===undefined) st[k]=def[k]; });
  plan.settings=st;
  if(!Array.isArray(plan.routines)){
    var ids={}; plan.days.forEach(function(d){ids[d.id]=1});
    var pinned=plan.days.filter(function(d){return d.pinned}).map(function(d){return d.id});
    plan.routines=[];
    if(pinned.length) plan.routines.push({id:'r'+uid8(),name:'My rotation',dayIds:pinned});
    STARTER_ROUTINES.forEach(function(r){
      if(r.dayIds.every(function(id){return ids[id]})) plan.routines.push({id:r.id,name:r.name,dayIds:r.dayIds.slice()});
    });
    plan.activeRoutine=plan.routines.length?plan.routines[0].id:'';
    changed=true;
  }
  if(plan.activeRoutine===undefined) plan.activeRoutine='';
  plan.days.forEach(function(d){ if('pinned' in d) delete d.pinned; });
  return changed;
}

/* ---------- storage: private account data when available, else this browser ---------- */
async function initStore(){
  try{
    var c=window.claude; if(!c||!c.use) return;
    var r=await Promise.all([c.use('user'),c.use('db')]);
    var u=r[0], d=r[1]; if(!u||!d) return;
    var id=await u.id(); if(!id) return;
    store.planRef=d.doc('data/users/'+id+'/plan');
    store.sessCol=d.doc('data/users/'+id+'/profile').collection('sessions');
    store.mode='cloud';
  }catch(e){}
}
async function loadAll(){
  if(store.mode==='cloud'){
    try{
      var ps=await store.planRef.get();
      plan=(ps.exists&&ps.data()&&ps.data().plan)||null;
      var qs=await store.sessCol.orderBy('startedAt','desc').limit(500).get();
      sessions={};
      qs.docs.forEach(function(d){ if(d.exists) sessions[d.id]=d.data(); });
      return;
    }catch(e){ store.mode='local'; store.degraded=true; }
  }
  try{
    plan=JSON.parse(localStorage.getItem('liftlog.plan')||'null');
    sessions=JSON.parse(localStorage.getItem('liftlog.sessions')||'{}')||{};
  }catch(e){ plan=null; sessions={}; }
}
async function persistPlan(){
  if(store.mode==='cloud'){ await store.planRef.set({plan:plan}); return; }
  localStorage.setItem('liftlog.plan',JSON.stringify(plan));
}
async function persistSession(id){
  var s=sessions[id];
  if(store.mode==='cloud'){
    if(s) await store.sessCol.doc(id).set(s); else await store.sessCol.doc(id).delete();
    return;
  }
  localStorage.setItem('liftlog.sessions',JSON.stringify(sessions));
}

/* one write at a time per document, debounced */
var pending=0, failed=false, timers={}, chains={}, fns={};
function paintStatus(){
  var el=$('#status'); if(!el) return;
  el.textContent=failed?'Could not save. Check your connection.':pending?'Saving…':
    (store.mode==='cloud'?'Saved to your account':(store.degraded?'Saved on this device only':'Saved on this device'));
}
function fire(key){
  delete timers[key];
  chains[key]=(chains[key]||Promise.resolve()).then(fns[key]).then(function(){failed=false},function(){failed=true}).then(function(){pending--;paintStatus()});
}
function schedule(key,fn,delay){
  fns[key]=fn;
  if(!timers[key]) pending++;
  clearTimeout(timers[key]);
  timers[key]=setTimeout(function(){fire(key)},delay==null?500:delay);
  paintStatus();
}

var annT=null;

var SIGA=['data-act','data-f','data-dir','data-date','data-tag','data-mode','data-unit','data-tab','data-ptab','data-wd','data-day','data-opt','data-vm'];
var CTXA=['data-ex','data-set','data-dayid','data-exid','data-rid','data-i','data-id'];
function sig(el){
  var v=$('#view');
  if(!el||el===document.body||!v||el===v||!v.contains(el)) return null;
  var o={tag:el.tagName,id:el.id,attrs:{},ctx:{}};
  SIGA.forEach(function(a){var x=el.getAttribute(a); if(x!=null) o.attrs[a]=x;});

/* ---------- audio, vibration, screen wake lock ---------- */
var actx=null, wake=null;
function audio(){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
    if(!actx) actx=new C();

  }catch(e){ return null; }
}
function beepAt(c,at,freq,dur){

}
function alertNow(){
  if(plan.settings.sound){
    var c=audio();
    if(c){ try{ var t=c.currentTime; beepAt(c,t,880,.18); beepAt(c,t+.28,880,.18); beepAt(c,t+.56,1175,.4); }catch(e){} }
  }

/* ---------- rest timer ---------- */
var timer=null;
function parseRest(v){
  v=String(v).trim(); if(v==='') return null;
  var m=v.match(/^(\d+):(\d{1,2})$/), n=m?(+m[1]*60+ +m[2]):parseInt(v,10);
  if(isNaN(n)||n<0) return undefined;
  return Math.min(900,n);
}
function restFor(name){
  var r=plan.rest[norm(name)];
  return (r==null)?plan.settings.rest:r;
}

  buildTimerBar();
}
function stopTimer(){ timer=null; buildTimerBar(); }
function adjustTimer(d){
  if(!timer||timer.state!=='run') return;
  timer.endsAt+=d*1000;
  if(timer.endsAt<=Date.now()+500) timer.endsAt=Date.now()+1000;
  var rem=timer.endsAt-Date.now();
  if(rem>timer.total*1000) timer.total=Math.ceil(rem/1000);
  paintClock(rem);
  announce('Rest timer now '+Math.ceil(rem/1000)+' seconds');
}
function paintClock(ms){
  var c=$('#tclock'), f=$('#tfill'); if(!c||!timer) return;
  var s=Math.max(0,Math.ceil(ms/1000));
  c.textContent=fmtDur(s*1000);
  if(f) f.style.width=Math.max(0,Math.min(100,(1-ms/(timer.total*1000))*100))+'%';
}
function buildTimerBar(){
  var el=$('#timerbar'); if(!el) return;
  if(!timer){ el.hidden=true; el.innerHTML=''; el.classList.remove('over'); syncDock(); return; }
  el.hidden=false;
  if(timer.state==='run'){
    el.classList.remove('over');
    el.innerHTML='<div class="tinfo"><span class="lbl">Rest · '+esc(timer.name)+'</span><span class="tclock" id="tclock"></span></div>'+
      '<div class="tbtns"><button class="mini" data-act="t-adj" data-d="-15">−15s</button>'+
      '<button class="mini" data-act="t-adj" data-d="15">+15s</button>'+
      '<button class="mini" data-act="t-skip" aria-label="Skip rest">Skip</button></div>'+
      '<div class="tprog" aria-hidden="true"><div id="tfill"></div></div>';
    paintClock(timer.endsAt-Date.now());
  } else {
    el.classList.add('over');
    el.innerHTML='<div class="tinfo"><span class="lbl">Rest over</span><span class="tclock go">Next set</span></div>'+
      '<div class="tbtns"><button class="btn primary" data-act="t-skip">Dismiss</button></div>';
  }
  syncDock();
}
function tickTimer(){
  if(!timer) return;
  var now=Date.now();
  if(timer.state==='run'){
    var rem=timer.endsAt-now;
    if(rem<=0){
      timer.state='done'; timer.doneAt=now;
      alertNow(); announce('Rest over. Start your next set.');
      buildTimerBar();
    } else paintClock(rem);
  } else if(now-timer.doneAt>20000){ stopTimer(); }
}

/* ---------- helpers ---------- */
function fmtN(n){ return String(+Number(n).toFixed(2)); }

function fmtK(v){ return v>=1000?(+(v/1000).toFixed(1))+'k':fmtN(v); }
function fmtDate(ms){ return new Date(ms).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}); }
function fmtShort(ms){ return new Date(ms).toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
function fmtDur(ms){
  var s=Math.max(0,Math.floor(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  var pad=function(v){return String(v).padStart(2,'0')};
  return h?(h+':'+pad(m)+':'+pad(x)):(m+':'+pad(x));
}
function activeSession(){

}
function finishedList(){

function lastFor(name){

}
function setVol(x){ return (x.w>0&&x.r>0)?x.w*x.r:0; }

}
function setCount(s){ return s.exercises.reduce(function(t,e){return t+e.sets.length},0); }
function targetOf(e){ return e.reps?(e.sets+' × '+e.reps):(e.sets+' sets'); }
function setText(x){

function allNames(){

}
function move(arr,i,dir){ var j=i+dir; if(j<0||j>=arr.length) return; var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }

function dkey(ms){ var d=new Date(ms); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function wdIdx(d){ return (d.getDay()+6)%7; }
function weekStart(ms){ var d=new Date(ms); d.setHours(0,0,0,0); d.setDate(d.getDate()-wdIdx(d)); return d.getTime(); }
var WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var GROUPS=['Chest','Back','Shoulders','Arms','Legs','Abs'];
/* Which muscle groups an exercise trains directly, judged from its name. Order of checks matters. */
function muscleOf(name){
  var n=norm(name);
  if(/leg raise|crunch|plank|twist|sit-?up|ab wheel|v-?up|hollow/.test(n)) return ['Abs'];
  if(/leg curl|leg extension|leg press|squat|lunge|calf|romanian|hip thrust|glute|hack|step-?up|good morning/.test(n)) return ['Legs'];
  if(/deadlift/.test(n)) return ['Back','Legs'];
  if(/curl|tricep|pushdown|skull|preacher|hammer|kickback/.test(n)) return ['Arms'];
  if(/lateral raise|front raise|shoulder press|overhead press|upright row|rear delt|reverse pec|reverse fly|face pull|arnold|shrug/.test(n)) return ['Shoulders'];
  if(/\bdips?\b/.test(n)) return ['Chest','Arms'];
  if(/pull-?up|chin-?up|pulldown|row|pullover|back extension|hyperextension/.test(n)) return ['Back'];
  if(/bench|chest|pec deck|fly|flye|push-?up|incline|decline|cable cross/.test(n)) return ['Chest'];

function daysSince(ms){
  var a=new Date(ms); a.setHours(0,0,0,0);

}
function groupStats(){
  var rec={}, sets={};

    var age=daysSince(s.startedAt);
    s.exercises.forEach(function(e){
      var n=e.sets.length; if(!n) return;

function planSets(d,g){

}

/* ---------- routines ---------- */

var PATTERNS={1:[0],2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,3,4],6:[0,1,2,3,4,5],7:[0,1,2,3,4,5,6]};

/* ---------- strength + volume maths ---------- */
var E1_MAX_REPS=12;
function e1rm(w,r){ if(!(w>0&&r>0)||r>E1_MAX_REPS) return 0; return r===1?w:w*(1+r/30); }

  var b=0, bs=null;
  sets.forEach(function(x){ var v=e1rm(x.w,x.r); if(v>b){b=v;bs=x;} });
  return {v:b,set:bs};
}
function prevBestE1(name,excludeId){
  var k=norm(name), b=0;
  finishedList().forEach(function(s){
    if(s.id===excludeId) return;
    s.exercises.forEach(function(e){ if(norm(e.name)!==k) return; var v=bestE1(e.sets).v; if(v>b) b=v; });
  });
  return b;
}
function e1Line(ex,sid){

  if(!cur.v) return '';
  var prev=prevBestE1(ex.name,sid);
  var t='Est. 1RM '+fmt1(cur.v)+' '+plan.unit+' from '+setText(cur.set);
  if(prev) t+=cur.v>prev+0.05?' · above your best of '+fmt1(prev):' · your best is '+fmt1(prev);
  return t;
}
function progressPoints(name,mode){

  finishedList().slice().reverse().forEach(function(s){
    var ex=s.exercises.find(function(e){return norm(e.name)===k}); if(!ex) return;
    var best=0;
    ex.sets.forEach(function(x){
      if(!(x.w>0)) return;
      var v=mode==='top'?x.w:e1rm(x.w,x.r);
      if(v>best) best=v;
    });
    if(best>0) pts.push({t:s.startedAt,v:+best.toFixed(1)});
  });
  return pts;
}

  var cur=Math.max.apply(null,pts.slice(-3).map(function(p){return p.v}));
  var bestPt=pts.reduce(function(a,b){return b.v>=a.v?b:a});
  return {pts:pts,cur:cur,best:bestPt.v,bestT:bestPt.t};
}
function milestoneFor(cur){
  var m=plan.unit==='lb'?10:5, step=plateStep(), target=(Math.floor(cur/m)+1)*m;
  function wfor(r){ return Math.ceil(weightForReps(target,r)/step-1e-9)*step; }

}
function volByGroup(s){
  var out={};
  s.exercises.forEach(function(e){
    var v=e.sets.reduce(function(t,x){return t+setVol(x)},0); if(!v) return;
    var gs=muscleOf(e.name); if(!gs.length) gs=['Other'];
    gs.forEach(function(g){ out[g]=(out[g]||0)+v/gs.length; });
  });
  return out;
}

function startSession(dayId,dateKey){
  var d=dayById(dayId);
  var fin=finishedList();
  var startMs=Date.now();
  if(dateKey&&dateKey!==dkey(startMs)){
    var pp=dateKey.split('-').map(Number), nw=new Date();
    startMs=new Date(pp[0],pp[1]-1,pp[2],nw.getHours(),nw.getMinutes()).getTime();
  }
  var s={id:'s'+Date.now().toString(36)+uid8().slice(0,3),dayId:d?d.id:null,name:d?d.name:'Workout',startedAt:startMs,finishedAt:null,status:'active',tag:d?(d.tag||''):'',
    place:(fin[0]&&fin[0].place)||'',note:'',
    exercises:(d?d.exercises:[]).map(function(e){
      return {id:uid8(),name:e.name,target:targetOf(e),note:e.note||'',
        sets:Array.from({length:Math.max(1,Math.min(20,+e.sets||3))},function(){return {w:null,r:null,done:false}})};
    })};

function finishSession(a){
  var ex2=a.exercises.map(function(e){
    return {id:e.id,name:e.name,target:e.target,note:e.note,
      sets:e.sets.filter(function(s){return s.done||s.r>0}).map(function(s){return {w:s.w,r:s.r,done:true}})};
  }).filter(function(e){return e.sets.length});
  if(!ex2.length){ ui.msg='Log at least one set before finishing.'; render(); return; }
  var prs=[];
  ex2.forEach(function(e){
    var cur=bestE1(e.sets).v; if(!cur) return;
    var prev=prevBestE1(e.name,a.id);
    if(prev>0&&cur>prev+0.05) prs.push({name:e.name,e1:+cur.toFixed(1),prev:+prev.toFixed(1)});
  });
  a.exercises=ex2; a.prs=prs; a.status='done'; a.finishedAt=(dkey(a.startedAt)===dkey(Date.now()))?Date.now():a.startedAt;
  ui.flash='Saved '+a.name+': '+setCount(a)+' sets, '+Math.round(volumeOf(a)).toLocaleString()+' '+plan.unit+' total volume.'+
    (prs.length?' New estimated 1RM: '+prs.slice(0,3).map(function(p){return p.name+' '+fmt1(p.e1)+' '+plan.unit+' (was '+fmt1(p.prev)+')'}).join(', ')+'.':'');
  stopTimer(); keepAwake(false);
  saveSession(a.id,true); announce(ui.flash); render();
}

async function exportBackup(){
  var data=JSON.stringify({app:'lift-log',version:1,exportedAt:new Date().toISOString(),plan:plan,sessions:sessions},null,1);
  var name='lift-log-backup-'+dkey(Date.now())+'.json', inViewer=!!(window.claude&&window.claude.use);

    var dl=inViewer?await window.claude.use('downloads'):null;
    if(dl){ await dl.save({filename:name,data:data}); ui.pflash='Backup ready. Choose where to keep it.'; announce(ui.pflash); render(); return; }
  }catch(e){ if(e&&e.code==='declined'){ return; } }
  if(inViewer){ ui.backupText=data; ui.pflash='Copy the backup text below.'; }
  else {
    try{
      var blob=new Blob([data],{type:'application/json'}), url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},4000);
      ui.pflash='Backup saved as '+name+' in your downloads.';
    }catch(e){ ui.backupText=data; ui.pflash='Could not save a file here. Copy the backup text below.'; }
  }
  announce(ui.pflash); render();

async function readBackupFile(file){
  if(!file) return;
  try{
    var obj=JSON.parse(await file.text());
    if(!obj||obj.app!=='lift-log'||!obj.plan||!Array.isArray(obj.plan.days)||!obj.sessions||typeof obj.sessions!=='object') throw new Error('shape');
    pendingBackup=obj; ui.pflash='';
  }catch(e){ pendingBackup=null; ui.pflash='That file is not a Lift Log backup.'; }
  announce(ui.pflash||'Backup file read. Confirm to restore.'); render();
}
function doRestore(){
  var pb=pendingBackup; pendingBackup=null; if(!pb) return;
  plan=pb.plan; upgradePlan(); var n=0;
  Object.keys(pb.sessions).forEach(function(id){
    var x=pb.sessions[id];
    if(x&&x.status==='done'&&typeof x.startedAt==='number'&&Array.isArray(x.exercises)){ x.id=id; sessions[id]=x; saveSession(id,true); n++; }
  });
  savePlan(true); applyPrefs();
  ui.pflash='Restored '+plan.days.length+' workouts and '+n+' session'+(n===1?'':'s')+'.'; announce(ui.pflash); render();
}

/* ---------- History: volume, strength, workouts ---------- */
function niceScale(min,max,n){
  n=n||4;
  if(min===max){ min=Math.max(0,min-5); max=max+5; }
  var raw=(max-min)/n, mag=Math.pow(10,Math.floor(Math.log10(raw))), norm1=raw/mag;
  var step=(norm1<=1?1:norm1<=2?2:norm1<=2.5?2.5:norm1<=5?5:10)*mag;
  var lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, ticks=[];
  for(var v=lo;v<=hi+1e-9;v+=step) ticks.push(+v.toFixed(4));
  return {lo:lo,hi:hi,ticks:ticks};
}
function chartHTML(pts,o){
  o=o||{};
  var f=o.fmt||fmtN, unit=o.unit||plan.unit, what=o.what||'Progress chart';
  var W=360,H=200,L=44,R=18,T=20,B=28;
  var vals=pts.map(function(p){return p.v}), sc=niceScale(Math.min.apply(null,vals),Math.max.apply(null,vals));
  var n=pts.length;
  var x=function(i){return n===1?(L+(W-L-R)/2):L+i*(W-L-R)/(n-1)};
  var y=function(v){return T+(H-T-B)*(1-(v-sc.lo)/(sc.hi-sc.lo))};
  var grid=sc.ticks.map(function(t){
    return '<line class="ch-g" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t).toFixed(1)+'" y2="'+y(t).toFixed(1)+'"/><text class="ch-t" x="'+(L-6)+'" y="'+(y(t)+4).toFixed(1)+'" text-anchor="end">'+f(t)+'</text>';
  }).join('');
  var path=pts.map(function(p,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)}).join(' ');
  var area=n>1?'<path class="ch-area" d="'+path+' L'+x(n-1).toFixed(1)+' '+(H-B)+' L'+x(0).toFixed(1)+' '+(H-B)+' Z"/>':'';
  var dots=pts.map(function(p,i){
    return '<circle class="'+(i===n-1?'ch-last':'ch-dot')+'" cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(i===n-1?5:3.5)+'"><title>'+esc(fmtShort(p.t)+': '+f(p.v)+' '+unit)+'</title></circle>';
  }).join('');
  var lx=x(n-1), anchor=lx>W-48?'end':'middle';
  var lastLbl='<text class="ch-v" x="'+(anchor==='end'?lx+4:lx).toFixed(1)+'" y="'+(y(pts[n-1].v)-10).toFixed(1)+'" text-anchor="'+anchor+'">'+f(pts[n-1].v)+'</text>';
  var xl='<text class="ch-t" x="'+(n===1?x(0):L)+'" y="'+(H-8)+'" text-anchor="'+(n===1?'middle':'start')+'">'+esc(fmtShort(pts[0].t))+'</text>'+
    (n>1?'<text class="ch-t" x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+esc(fmtShort(pts[n-1].t))+'</text>':'');
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(what)+', '+n+' point'+(n===1?'':'s')+', latest '+esc(f(pts[n-1].v)+' '+unit)+'. A table of the values follows.">'+grid+area+'<path class="ch-line" d="'+path+'"/>'+dots+lastLbl+xl+'</svg></div>';
}
function barsHTML(items,o){
  o=o||{};
  var unit=o.unit||plan.unit, what=o.what||'Bar chart';
  var W=360,H=210,L=44,R=10,T=24,B=30, n=items.length;
  var mx=Math.max.apply(null,items.map(function(i){return i.v}));
  var sc=niceScale(0,mx||1);
  var slot=(W-L-R)/n, bw=slot*0.62;
  var y=function(v){return T+(H-T-B)*(1-(v-sc.lo)/(sc.hi-sc.lo))};
  var grid=sc.ticks.map(function(t){
    return '<line class="ch-g" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t).toFixed(1)+'" y2="'+y(t).toFixed(1)+'"/><text class="ch-t" x="'+(L-6)+'" y="'+(y(t)+4).toFixed(1)+'" text-anchor="end">'+fmtK(t)+'</text>';
  }).join('');
  var bars=items.map(function(it,i){
    var cx=L+slot*i+slot/2, top=y(it.v), h=Math.max(0,(H-B)-top);
    return (it.v>0?'<rect class="ch-bar'+(it.cur?' cur':'')+'" x="'+(cx-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2"><title>'+esc(it.label+': '+fmtN(Math.round(it.v))+' '+unit)+'</title></rect>'+
        '<text class="ch-v" x="'+cx.toFixed(1)+'" y="'+(top-5).toFixed(1)+'" text-anchor="middle">'+fmtK(Math.round(it.v))+'</text>':'')+
      ((n<=6||(n-1-i)%2===0)?'<text class="ch-t" x="'+cx.toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(it.label)+'</text>':'');
  }).join('');
  var cur=items[n-1];
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(what)+', '+n+' weeks, this week '+esc(fmtN(Math.round(cur.v))+' '+unit)+'. A table of the values follows.">'+grid+bars+'</svg></div>';
}
function tableHTML(cap,heads,rows){
  return '<details class="tbl"><summary>View '+esc(cap).replace(/1rm/g,'1RM')+' as a table</summary><div class="tblwrap"><table><caption class="sr">'+esc(cap)+'</caption><thead><tr>'+
    heads.map(function(h){return '<th scope="col">'+esc(h)+'</th>'}).join('')+'</tr></thead><tbody>'+
    rows.map(function(r){return '<tr>'+r.map(function(c,i){return i===0?'<th scope="row">'+esc(c)+'</th>':'<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+
    '</tbody></table></div></details>';
}
function pctChange(a,b){ return (b>0&&a>0)?((a-b)/b>=0?'+':'')+Math.round((a-b)/b*100)+'%':'–'; }
function volumeSection(fin){
  var present={};
  fin.forEach(function(s){ Object.keys(volByGroup(s)).forEach(function(k){present[k]=1}); });
  var gopts=['All'].concat(GROUPS.filter(function(x){return present[x]})).concat(present.Other?['Other']:[]);
  if(gopts.indexOf(ui.volGroup)<0) ui.volGroup='All';
  var g=ui.volGroup, u=plan.unit;
  var gsel='<select id="volgroup" aria-label="Muscle group">'+gopts.map(function(x){return '<option value="'+esc(x)+'"'+(x===g?' selected':'')+'>'+(x==='All'?'All muscles':esc(x))+'</option>'}).join('')+'</select>';
  var modes=[['week','Per week'],['workout','Per workout']].map(function(m){return '<button data-act="vmode" data-vm="'+m[0]+'" aria-pressed="'+(ui.volMode===m[0])+'">'+m[1]+'</button>'}).join('');
  var wk0=weekStart(Date.now()), weeks=[];
  for(var k=7;k>=0;k--){ var d=new Date(wk0); d.setDate(d.getDate()-7*k); weeks.push({start:d.getTime(),v:0}); }
  fin.forEach(function(s){ var ws=weekStart(s.startedAt), w=weeks.find(function(x){return x.start===ws}); if(w) w.v+=sessVol(s,g); });
  var tw=weeks[7].v, lw=weeks[6].v, gl=g==='All'?'all muscles':g;
  var sum=(tw||lw)?('This week so far, '+gl+': '+fmtN(Math.round(tw))+' '+u+'. Last week: '+fmtN(Math.round(lw))+' '+u+(lw>0&&tw>0?' ('+pctChange(tw,lw)+' so far).':'.')):'No '+gl+' volume logged in the last two weeks.';
  var chart='';
  if(ui.volMode==='week'){
    var items=weeks.map(function(w,i){return {label:fmtShort(w.start),v:w.v,cur:i===7}});
    chart=barsHTML(items,{unit:u,what:'Weekly volume for '+gl})+
      tableHTML('weekly volume',['Week starting','Volume ('+u+')'],weeks.map(function(w){return [fmtShort(w.start),fmtN(Math.round(w.v))]}));
  } else {
    var pts=fin.slice().reverse().map(function(s){return {t:s.startedAt,v:Math.round(sessVol(s,g)),n:s.name}}).filter(function(p){return p.v>0}).slice(-20);
    chart=pts.length
      ?chartHTML(pts,{fmt:fmtK,unit:u,what:'Volume per workout for '+gl})+tableHTML('volume per workout',['Date','Workout','Volume ('+u+')'],pts.map(function(p){return [fmtShort(p.t),p.n,fmtN(p.v)]}))
      :'<p class="sub">No weighted sets logged for this muscle group yet.</p>';
  }
  var tg={}, lg={}, lwStart=weeks[6].start;
  fin.forEach(function(s){
    var ws=weekStart(s.startedAt), vg=volByGroup(s);
    Object.keys(vg).forEach(function(kk){ if(ws===wk0) tg[kk]=(tg[kk]||0)+vg[kk]; else if(ws===lwStart) lg[kk]=(lg[kk]||0)+vg[kk]; });
  });
  var rows=GROUPS.concat(['Other']).filter(function(x){return tg[x]||lg[x]}).map(function(x){
    var a=tg[x]||0, b=lg[x]||0; return [x,fmtN(Math.round(a)),fmtN(Math.round(b)),pctChange(a,b)];
  });
  var gtable=rows.length?'<div class="tblwrap"><table><caption class="lbl" style="text-align:left;margin:16px 0 4px">Volume by muscle group, this week and last week ('+esc(u)+')</caption><thead><tr><th scope="col">Group</th><th scope="col">This week</th><th scope="col">Last week</th><th scope="col">Change</th></tr></thead><tbody>'+
    rows.map(function(r){return '<tr><th scope="row">'+esc(r[0])+'</th><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>'}).join('')+'</tbody></table></div>':'';
  return '<section class="prog" aria-labelledby="vol-h"><h2 id="vol-h">Volume</h2>'+
    '<div class="prog-ctl">'+gsel+'<span class="seg" role="group" aria-label="Volume view">'+modes+'</span></div>'+
    '<p class="sumline">'+esc(sum)+'</p>'+chart+gtable+
    '<p class="note">Volume is weight × reps, added up. Bodyweight sets with no weight logged are not counted. Exercises that train two groups, like deadlifts, are split evenly between them. Rising volume over several weeks is one sign of progressive overload.</p></section>';
}
function strengthSection(fin,keys,display,counts){
  if(!ui.chartEx||!counts[norm(ui.chartEx)]) ui.chartEx=display[keys[0]];
  var u=plan.unit, step=plateStep();
  var opts=keys.map(function(k){return '<option value="'+esc(display[k])+'"'+(norm(display[k])===norm(ui.chartEx)?' selected':'')+'>'+esc(display[k])+'</option>'}).join('');
  var modeBtns=[['e1rm','Est. 1RM'],['top','Top weight']].map(function(m){return '<button data-act="mode" data-mode="'+m[0]+'" aria-pressed="'+(ui.chartMode===m[0])+'">'+m[1]+'</button>'}).join('');
  var pts=progressPoints(ui.chartEx,ui.chartMode), label=ui.chartMode==='e1rm'?'Estimated 1RM':'Top weight';
  var chart=pts.length
    ?chartHTML(pts,{unit:u,what:label+' for '+ui.chartEx})+tableHTML(label.toLowerCase(),['Date',label+' ('+u+')'],pts.map(function(p){return [fmtShort(p.t),fmt1(p.v)]}))
    :'<p class="sub">No weighted sets logged for this lift yet.</p>';
  var info='', st=strengthFor(ui.chartEx);
  if(st){
    var ms=milestoneFor(st.cur);
    var preds=[1,3,5,8,10].map(function(r){return [r+(r===1?' rep':' reps'),fmtN(Math.round(weightForReps(st.cur,r)/step)*step)+' '+u]});
    info='<div class="stats" style="margin-top:14px"><div class="stat"><b>'+fmt1(st.cur)+'</b><span>Est. 1RM now, '+esc(u)+'</span></div>'+
      '<div class="stat"><b>'+fmt1(st.best)+'</b><span>Best, '+esc(fmtShort(st.bestT))+'</span></div>'+
      '<div class="stat"><b>'+st.pts.length+'</b><span>Sessions</span></div></div>'+
      '<div class="miles"><h3>Next milestone: '+ms.target+' '+esc(u)+'</h3><p>You are '+fmt1(ms.away)+' '+esc(u)+' away. Try 5 reps at '+fmtN(ms.w5)+' '+esc(u)+' or 8 reps at '+fmtN(ms.w8)+' '+esc(u)+'.</p></div>'+
      '<div class="preds"><h3>Predicted weights for your current estimate</h3><div class="tblwrap"><table><caption class="sr">Predicted weight for each rep count</caption><thead><tr><th scope="col">Reps</th><th scope="col">Weight</th></tr></thead><tbody>'+
      preds.map(function(r){return '<tr><th scope="row">'+r[0]+'</th><td>'+r[1]+'</td></tr>'}).join('')+'</tbody></table></div></div>'+
      '<p class="note">Estimates use the Epley formula and count sets of up to '+E1_MAX_REPS+' reps. The current estimate is your best of the last three sessions. Treat them as a guide, not a max test.</p>';
  } else if(ui.chartMode==='e1rm'){
    info='<p class="note">Log a set with weight and 1 to '+E1_MAX_REPS+' reps to get an estimate.</p>';
  }
  return '<section class="prog" aria-labelledby="str-h"><h2 id="str-h">Strength</h2><div class="prog-ctl"><select id="chartex" aria-label="Exercise">'+opts+'</select>'+
    '<span class="seg" role="group" aria-label="Chart measure">'+modeBtns+'</span></div>'+chart+info+'</section>';
}
function sessionRowHTML(s,open,fixed){
  var mins=(s.finishedAt&&s.finishedAt-s.startedAt>=60000)?Math.round((s.finishedAt-s.startedAt)/60000):0;
  var inner='<span class="hname">'+esc(s.name)+'</span><span class="hdate">'+fmtDate(s.startedAt)+'</span>'+
    '<span class="hmeta">'+s.exercises.length+' exercises · '+setCount(s)+' sets · '+Math.round(volumeOf(s)).toLocaleString()+' '+esc(plan.unit)+'</span>';
  var head=fixed?'<div class="hhead">'+inner+'</div>'
    :'<button class="hhead" data-act="togglesess" data-id="'+esc(s.id)+'" aria-expanded="'+open+'" aria-controls="hb-'+esc(s.id)+'">'+inner+'</button>';
  var body='';
  if(open){
    var prs=s.prs||[];
    var exs=s.exercises.map(function(e){
      var pr=prs.some(function(p){return norm(p.name)===norm(e.name)});
      return '<div class="hex"><strong>'+esc(e.name)+(pr?'<span class="prtag">New 1RM</span>':'')+'</strong><span>'+e.sets.map(setText).join(' · ')+'</span></div>';
    }).join('');
    var meta=[s.place?esc(s.place):'',mins&&mins<600?mins+' min':''].filter(Boolean).join(' · ');
    var confirm=ui.confirm==='delsess:'+s.id
      ?'<div class="confirm" role="group" aria-label="Confirm delete workout">Delete this workout?<button class="btn danger" data-act="delsessyes">Delete</button><button class="btn" data-act="delsessno">Cancel</button></div>'
      :'<button class="link" data-act="delsess">Delete workout</button>';
    body='<div class="hbody" id="hb-'+esc(s.id)+'">'+(meta?'<p class="hnote" style="margin-top:10px">'+meta+'</p>':'')+exs+(s.note?'<p class="hnote">'+esc(s.note)+'</p>':'')+confirm+'</div>';
  }
  return '<article class="hrow" data-id="'+esc(s.id)+'">'+head+body+'</article>';
}
function viewHistory(){
  var fin=finishedList();
  if(!fin.length) return '<h2>History</h2><p class="sub">Finished workouts show up here, along with volume, estimated 1RM and progress charts for each lift.</p>';
  var ws=new Date(); ws.setHours(0,0,0,0); ws.setDate(ws.getDate()-((ws.getDay()+6)%7));
  var wk=fin.filter(function(s){return s.startedAt>=ws.getTime()});
  var wkVol=wk.reduce(function(t,s){return t+volumeOf(s)},0);
  var m28=fin.filter(function(s){return s.startedAt>=Date.now()-28*864e5}).length;
  var stats='<div class="stats"><div class="stat"><b>'+wk.length+'</b><span>Sessions this week</span></div>'+
    '<div class="stat"><b>'+Math.round(wkVol).toLocaleString()+'</b><span>Volume, '+esc(plan.unit)+'</span></div>'+
    '<div class="stat"><b>'+(m28/4).toFixed(1)+'</b><span>Per week, last 4 weeks</span></div></div>';
  var counts={}, display={};
  fin.forEach(function(s){s.exercises.forEach(function(e){var k=norm(e.name); counts[k]=(counts[k]||0)+1; display[k]=e.name;})});
  var keys=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]||a.localeCompare(b)});
  var list=fin.map(function(s){return sessionRowHTML(s,ui.openSess===s.id)}).join('');
  return '<h2>History</h2>'+stats+volumeSection(fin)+strengthSection(fin,keys,display,counts)+'<h2>Workouts</h2>'+list;
}

/* ---------- Calendar ---------- */
function viewCalendar(){
  var now=new Date(), todayKey=dkey(now.getTime());
  if(!ui.calMonth) ui.calMonth={y:now.getFullYear(),m:now.getMonth()};
  if(!ui.calDay) ui.calDay=todayKey;
  var y=ui.calMonth.y, m=ui.calMonth.m;
  var lead=(new Date(y,m,1).getDay()+6)%7, dim=new Date(y,m+1,0).getDate();
  var by={}; finishedList().forEach(function(s){ var k=dkey(s.startedAt); (by[k]=by[k]||[]).push(s); });
  var cells='';
  for(var i=0;i<lead;i++) cells+='<span></span>';
  for(var d=1;d<=dim;d++){
    var dt=new Date(y,m,d), k=dkey(dt.getTime()), sch=plan.schedule[wdIdx(dt)];
    var cls='cd'+(k===todayKey?' today':'');
    var dot=by[k]?'done':(sch?'sched':'');
    cells+='<button class="'+cls+'" data-act="calday" data-date="'+k+'" aria-pressed="'+(k===ui.calDay)+'"'+(k===todayKey?' aria-current="date"':'')+' aria-label="'+esc(fmtDate(dt.getTime())+(by[k]?', workout logged':(sch?', workout scheduled':'')))+'"><span aria-hidden="true">'+d+'</span><span class="dot '+dot+'" aria-hidden="true"></span></button>';
  }
  var title=new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
  var head='<div class="calhead"><h2>'+esc(title)+'</h2><div class="calnav">'+
    '<button class="mini" data-act="calnav" data-dir="-1" aria-label="Previous month"><span aria-hidden="true">‹</span></button>'+
    '<button class="mini" data-act="calnav" data-dir="0">Today</button>'+
    '<button class="mini" data-act="calnav" data-dir="1" aria-label="Next month"><span aria-hidden="true">›</span></button></div></div>';
  var dow='<div class="dow" aria-hidden="true">'+['M','T','W','T','F','S','S'].map(function(x){return '<span>'+x+'</span>'}).join('')+'</div>';
  var legend='<div class="legend"><span><i class="done"></i>Logged</span><span><i></i>Scheduled</span></div>';
  var sel=ui.calDay, pp=sel.split('-').map(Number), selDt=new Date(pp[0],pp[1]-1,pp[2]);
  var future=sel>todayKey;
  var sday=dayById(plan.schedule[wdIdx(selDt)]);
  var line=sday?('Scheduled: '+sday.name):(plan.schedule.some(Boolean)?'Rest day':'Nothing scheduled for this day');
  var sess=(by[sel]||[]).map(function(x){return sessionRowHTML(x,true,true)}).join('');
  var log='';
  if(!future){
    if(activeSession()){
      log='<p class="sub" style="margin-top:14px">Finish or discard your current workout on the Today tab before logging another.</p>';
    } else {
      var opts='<option value="">Empty workout</option>'+plan.days.map(function(x){return '<option value="'+esc(x.id)+'"'+(sday&&sday.id===x.id?' selected':'')+'>'+esc(x.name||'Untitled workout')+'</option>'}).join('');
      log='<div class="addex"><select id="calpick" aria-label="Workout to log on this day">'+opts+'</select><button class="btn primary" data-act="calstart">Log</button></div>';
    }
  }
  var panel='<section class="daypanel" aria-label="Selected day"><h2>'+esc(fmtDate(selDt.getTime()))+'</h2><p class="sub" style="margin-bottom:6px">'+esc(line)+'</p>'+
    (sess||(future?'':'<p class="sub">Nothing logged on this day.</p>'))+log+'</section>';
  return head+dow+'<div class="cal" role="group" aria-label="'+esc(title)+'">'+cells+'</div>'+legend+panel;
}

/* ---------- render + events ---------- */
var TAB_NAMES={today:'Today',plan:'Plan',calendar:'Calendar',history:'History'};
function render(){
  if(!plan) return;
  var key=sig(document.activeElement);
  lastKey=dkey(Date.now());
  var v=ui.tab==='plan'?viewPlan():ui.tab==='history'?viewHistory():ui.tab==='calendar'?viewCalendar():viewToday();
  $('#view').innerHTML=v;
  ['today','plan','calendar','history'].forEach(function(t){
    var b=$('#tab-'+t); if(ui.tab===t) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  var has=activeSession();
  $('#tab-today').innerHTML='Today'+(has?'<span class="dot" aria-hidden="true"></span><span class="sr"> (workout in progress)</span>':'');
  paintStatus();
  var target=null, sel=ui.focusSel; ui.focusSel=null;
  if(sel) target=$('#view').querySelector(sel);
  if(!target&&key) target=findBySig(key);
  if(target){ target.focus({preventScroll:true}); }
  else if(key){ $('#view').focus({preventScroll:true}); }
}
function findDay(el){ var n=el.closest('[data-dayid]'); return n?dayById(n.dataset.dayid):null; }
function findRoutine(el){ var n=el.closest('[data-rid]'); return n?routineById(n.dataset.rid):null; }

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]'); if(!b||!plan) return;
  var act=b.dataset.act, a=activeSession();
  if(act==='skip'){ var m=$('#view'); m.focus(); m.scrollIntoView(); return; }
  if(act==='t-skip'){ stopTimer(); announce('Rest skipped'); return; }
  if(act==='t-adj'){ adjustTimer(+b.dataset.d); return; }
  if(act==='testalert'){ audio(); alertNow(); announce('Test alert played'); return; }
  if(act==='noop') return;
  if(act==='export'){ exportBackup(); return; }
  if(act==='pickfile'){ var bf=$('#bkfile'); if(bf) bf.click(); return; }
  if(act==='impyes'){ doRestore(); return; }
  if(act==='copybackup'){
    var bt=$('#bktext');
    try{ navigator.clipboard.writeText(ui.backupText).then(function(){announce('Copied')},function(){ if(bt){bt.select();} }); }catch(e){ if(bt) bt.select(); }
    return;
  }
  if(act==='install'){
    if(installEvt){ var ie=installEvt; ie.prompt(); ie.userChoice.then(function(){ installEvt=null; render(); },function(){}); }
    return;
  }
  if(act!=='finish') ui.msg='';
  var exEl=b.closest('[data-ex]'), ex=a&&exEl?a.exercises.find(function(e){return e.id===exEl.dataset.ex}):null;
  var setEl=b.closest('[data-set]'), si=setEl?+setEl.dataset.set:-1;
  switch(act){
    case 'tab': ui.tab=b.dataset.tab; ui.confirm=null; ui.flash=''; ui.pflash=''; window.scrollTo(0,0); announce(TAB_NAMES[ui.tab]+' tab'); break;
    case 'plantab': ui.ptab=b.dataset.ptab; ui.confirm=null; ui.pflash=''; break;
    case 'start': startSession(b.dataset.day); return;
    case 'startempty': startSession(null); return;
    case 'chk':
      if(ex&&si>=0){
        var s=ex.sets[si], turningOn=!s.done; s.done=turningOn;
        if(turningOn){
          var last=lastFor(ex.name), ph=last?last[Math.min(si,last.length-1)]:null;
          if(ph){ if(s.w==null&&ph.w!=null) s.w=ph.w; if(s.r==null&&ph.r!=null) s.r=ph.r; }
          var allDone=a.exercises.every(function(e){return e.sets.every(function(x){return x.done})});
          var rs=restFor(ex.name), msg='Set '+(si+1)+' of '+ex.name+' done.';
          if(allDone){ stopTimer(); msg+=' Workout complete. Finish when ready.'; }
          else if(plan.settings.timer&&rs>0){
            if(plan.settings.sound) audio();
            startTimer(rs,ex.name); msg+=' Rest '+rs+' seconds.';
          }
          announce(msg);
        } else announce('Set '+(si+1)+' of '+ex.name+' marked not done');
        saveSession(a.id);
      }
      break;
    case 'rmset': if(ex&&si>=0){ ex.sets.splice(si,1); saveSession(a.id); announce('Set removed'); } break;
    case 'addset':
      if(ex){ var p=ex.sets[ex.sets.length-1]; ex.sets.push({w:p?p.w:null,r:p?p.r:null,done:false}); saveSession(a.id); announce('Set '+ex.sets.length+' added'); }
      break;
    case 'rmex': if(ex){ a.exercises=a.exercises.filter(function(e){return e!==ex}); saveSession(a.id); announce(ex.name+' removed'); } break;
    case 'addex':
      var inp=$('#newex'), nm=inp?inp.value.trim():'';
      if(a&&nm){ a.exercises.push({id:uid8(),name:nm,target:'',note:'',sets:[{w:null,r:null,done:false},{w:null,r:null,done:false},{w:null,r:null,done:false}]}); saveSession(a.id); announce(nm+' added'); ui.focusSel='#newex'; }
      break;
    case 'finish': if(a) finishSession(a); return;
    case 'discard': ui.confirm='discard'; ui.focusSel='[data-act="discardno"]'; break;
    case 'discardno': ui.confirm=null; ui.focusSel='[data-act="discard"]'; break;
    case 'discardyes': if(a){ delete sessions[a.id]; saveSession(a.id,true); stopTimer(); keepAwake(false); announce('Workout discarded'); } ui.confirm=null; break;
    case 'filter': ui.filter=b.dataset.tag; break;
    case 'gocal': ui.tab='calendar'; ui.calDay=b.dataset.date; var gp=b.dataset.date.split('-').map(Number); ui.calMonth={y:gp[0],m:gp[1]-1}; ui.confirm=null; window.scrollTo(0,0); announce('Calendar tab'); break;
    case 'calday': ui.calDay=b.dataset.date; ui.confirm=null; break;
    case 'calnav':
      var dir=+b.dataset.dir;
      if(dir===0){ var nw0=new Date(); ui.calMonth={y:nw0.getFullYear(),m:nw0.getMonth()}; ui.calDay=dkey(nw0.getTime()); }
      else { var nm2=new Date(ui.calMonth.y,ui.calMonth.m+dir,1); ui.calMonth={y:nm2.getFullYear(),m:nm2.getMonth()}; }
      break;
    case 'calstart':
      var pk=$('#calpick'); ui.tab='today';
      if(a) break;
      startSession(pk&&pk.value?pk.value:null,ui.calDay); return;
    /* settings */
    case 'unit': plan.unit=b.dataset.unit; savePlan(); break;
    case 'textsize': plan.settings.text=+b.dataset.opt; savePlan(); applyPrefs(); break;
    /* workouts */
    case 'toggleday': var dd=findDay(b); ui.openDay=(ui.openDay===dd.id)?null:dd.id; ui.confirm=null; break;
    case 'addday':
      var nd={id:'d'+uid8(),name:'Workout '+(plan.days.length+1),tag:'',exercises:[]}; plan.days.push(nd); ui.openDay=nd.id; savePlan();
      ui.focusSel='[data-dayid="'+nd.id+'"] [data-f="dayname"]'; break;
    case 'dupday':
      var d0=findDay(b), c0=copyDay(d0,' (copy)'); plan.days.splice(plan.days.indexOf(d0)+1,0,c0); ui.openDay=c0.id; savePlan();
      ui.pflash='Duplicated '+d0.name+'. Edit the copy below.'; ui.focusSel='[data-dayid="'+c0.id+'"] [data-f="dayname"]'; announce(ui.pflash); break;
    case 'mvday': var d1=findDay(b); move(plan.days,plan.days.indexOf(d1),+b.dataset.dir); savePlan(); break;
    case 'delday': var dx=findDay(b); ui.confirm='delday:'+dx.id; ui.focusSel='[data-dayid="'+dx.id+'"] [data-act="delno"]'; break;
    case 'delno': var dn0=findDay(b); ui.confirm=null; ui.focusSel='[data-dayid="'+dn0.id+'"] [data-act="delday"]'; break;
    case 'delyes':
      var d2=findDay(b); plan.days=plan.days.filter(function(d){return d!==d2});
      plan.schedule=plan.schedule.map(function(x){return x===d2.id?'':x});
      plan.routines.forEach(function(r){r.dayIds=r.dayIds.filter(function(id){return id!==d2.id})});
      ui.openDay=null; ui.confirm=null; savePlan(); announce(d2.name+' deleted'); break;
    case 'addexplan':
      var d3=findDay(b), ne={id:'e'+uid8(),name:'',sets:3,reps:'8-12',note:''}; d3.exercises.push(ne); savePlan();
      ui.focusSel='[data-exid="'+ne.id+'"] [data-f="exname"]'; break;
    case 'mvex': var d4=findDay(b), eid=b.closest('[data-exid]').dataset.exid; move(d4.exercises,d4.exercises.findIndex(function(e){return e.id===eid}),+b.dataset.dir); savePlan(); break;
    case 'delex': var d5=findDay(b), eid2=b.closest('[data-exid]').dataset.exid; d5.exercises=d5.exercises.filter(function(e){return e.id!==eid2}); savePlan(); break;
    /* routines */
    case 'toggleroutine': var rt0=findRoutine(b); ui.openRoutine=(ui.openRoutine===rt0.id)?null:rt0.id; ui.confirm=null; break;
    case 'addrt':
      var nr={id:'r'+uid8(),name:'New routine',dayIds:[]}; plan.routines.push(nr); ui.openRoutine=nr.id; savePlan();
      ui.focusSel='[data-rid="'+nr.id+'"] [data-f="rname"]'; break;
    case 'duprt':
      var r1=findRoutine(b), map={}, cnt=0;
      var ids=r1.dayIds.map(function(id){
        if(!map[id]){ var d=dayById(id); if(!d) return null; var c=copyDay(d,' (copy)'); map[id]=c.id; plan.days.push(c); cnt++; }
        return map[id];
      }).filter(Boolean);
      var dup={id:'r'+uid8(),name:r1.name+' copy',dayIds:ids};
      plan.routines.splice(plan.routines.indexOf(r1)+1,0,dup); ui.openRoutine=dup.id; savePlan();
      ui.pflash='Duplicated '+r1.name+' with its '+cnt+' workout'+(cnt===1?'':'s')+'. Rename and edit the copy freely.';
      ui.focusSel='[data-rid="'+dup.id+'"] [data-f="rname"]'; announce(ui.pflash); break;
    case 'delrt': var r2=findRoutine(b); ui.confirm='delrt:'+r2.id; ui.focusSel='[data-rid="'+r2.id+'"] [data-act="delrtno"]'; break;
    case 'delrtno': var r3=findRoutine(b); ui.confirm=null; ui.focusSel='[data-rid="'+r3.id+'"] [data-act="delrt"]'; break;
    case 'delrtyes':
      var r4=findRoutine(b); plan.routines=plan.routines.filter(function(r){return r!==r4});
      if(plan.activeRoutine===r4.id) plan.activeRoutine='';
      ui.openRoutine=null; ui.confirm=null; savePlan(); announce(r4.name+' deleted'); break;
    case 'rdactive':
      var r5=findRoutine(b); plan.activeRoutine=r5.id; savePlan(); ui.pflash=r5.name+' is now your active routine.'; announce(ui.pflash); break;
    case 'rdadd':
      var r6=findRoutine(b), sel=b.closest('[data-rid]').querySelector('[data-f="rdpick"]');
      if(sel&&sel.value){ r6.dayIds.push(sel.value); savePlan(); announce('Workout added'); ui.focusSel='[data-rid="'+r6.id+'"] [data-f="rdpick"]'; }
      break;
    case 'mvrd': var r7=findRoutine(b), i7=+b.closest('[data-i]').dataset.i; move(r7.dayIds,i7,+b.dataset.dir); savePlan(); break;
    case 'rmrd': var r8=findRoutine(b), i8=+b.closest('[data-i]').dataset.i; r8.dayIds.splice(i8,1); savePlan(); announce('Workout removed from routine'); break;
    case 'fillweek':
      var r9=findRoutine(b);
      if(fillWeek(r9)){ savePlan(); ui.pflash='Weekly schedule filled from '+r9.name+'. Check it at the bottom of this page.'; }
      else ui.pflash='Add at least one workout to '+r9.name+' first.';
      announce(ui.pflash); break;
    /* history */
    case 'mode': ui.chartMode=b.dataset.mode; break;
    case 'vmode': ui.volMode=b.dataset.vm; break;
    case 'togglesess': ui.openSess=(ui.openSess===b.dataset.id)?null:b.dataset.id; ui.confirm=null; break;
    case 'delsess': var sid0=b.closest('[data-id]').dataset.id; ui.confirm='delsess:'+sid0; ui.focusSel='[data-id="'+sid0+'"] [data-act="delsessno"]'; break;
    case 'delsessno': var sid1=b.closest('[data-id]').dataset.id; ui.confirm=null; ui.focusSel='[data-id="'+sid1+'"] [data-act="delsess"]'; break;
    case 'impno': pendingBackup=null; break;
    case 'closebackup': ui.backupText=''; break;
    case 'delsessyes':
      var sid=b.closest('[data-id]').dataset.id; delete sessions[sid]; saveSession(sid,true); ui.confirm=null; ui.openSess=null; announce('Workout deleted'); break;
    default: return;
  }
  render();
});

document.addEventListener('input',function(ev){
  var t=ev.target, f=t.dataset&&t.dataset.f, a=activeSession();
  if(!plan) return;
  if(t.id==='place'&&a){ a.place=t.value; saveSession(a.id); return; }
  if(t.id==='snote'&&a){ a.note=t.value; saveSession(a.id); return; }
  if(!f) return;
  if(f==='w'||f==='r'){
    var exEl=t.closest('[data-ex]'), setEl=t.closest('[data-set]'); if(!a||!exEl||!setEl) return;
    var ex=a.exercises.find(function(e){return e.id===exEl.dataset.ex}); if(!ex) return;
    ex.sets[+setEl.dataset.set][f]=parseNum(t.value); saveSession(a.id);
    var e1=exEl.querySelector('[data-e1]'); if(e1) e1.textContent=e1Line(ex,a.id);
    return;
  }
  if(f==='rest'){
    var exEl2=t.closest('[data-ex]'); if(!a||!exEl2) return;
    var ex2=a.exercises.find(function(e){return e.id===exEl2.dataset.ex}); if(!ex2) return;
    var p=parseRest(t.value); if(p===undefined) return;
    if(p===null) delete plan.rest[norm(ex2.name)]; else plan.rest[norm(ex2.name)]=p;
    savePlan(); return;
  }
  if(f==='set-rest'){
    var p2=parseRest(t.value);
    if(p2===null) plan.settings.rest=90; else if(p2!==undefined&&p2>=10) plan.settings.rest=p2; else return;
    savePlan(); return;
  }
  if(f==='rname'){ var rr=findRoutine(t); if(rr){ rr.name=t.value; savePlan(); } return; }
  var d=findDay(t); if(!d) return;
  if(f==='dayname'){ d.name=t.value; savePlan(); return; }
  var eEl=t.closest('[data-exid]'); if(!eEl) return;
  var e=d.exercises.find(function(x){return x.id===eEl.dataset.exid}); if(!e) return;
  if(f==='exname') e.name=t.value;
  else if(f==='exreps') e.reps=t.value;
  else if(f==='exnote') e.note=t.value;
  else if(f==='exsets'){ var n=parseInt(t.value,10); e.sets=isNaN(n)?3:Math.max(1,Math.min(20,n)); }
  else if(f==='exrest'){
    var p3=parseRest(t.value); if(p3===undefined) return;
    if(p3===null) delete plan.rest[norm(e.name)]; else plan.rest[norm(e.name)]=p3;
  }
  savePlan();
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(!plan) return;
  if(t.id==='bkfile'){ var bfile=t.files&&t.files[0]; readBackupFile(bfile); t.value=''; return; }
  if(t.id==='chartex'){ ui.chartEx=t.value; render(); return; }
  if(t.id==='volgroup'){ ui.volGroup=t.value; render(); return; }
  if(t.id==='sdate'){
    var a2=activeSession();
    if(a2&&t.value){
      var pp=t.value.split('-').map(Number), old=new Date(a2.startedAt);
      var ms=new Date(pp[0],pp[1]-1,pp[2],old.getHours(),old.getMinutes()).getTime();
      a2.startedAt=Math.min(ms,Date.now()); saveSession(a2.id); render();
    }
    return;
  }
  var f=t.dataset&&t.dataset.f;
  if(f==='sched'){ plan.schedule[+t.dataset.wd]=t.value; savePlan(); return; }
  if(f==='daytag'){ var d=findDay(t); if(d){ d.tag=t.value; savePlan(); render(); } return; }
  var opts={'opt-timer':'timer','opt-sound':'sound','opt-vibrate':'vibrate','opt-awake':'awake','opt-contrast':'contrast'};
  if(f&&opts[f]){
    plan.settings[opts[f]]=t.checked; savePlan();
    if(f==='opt-contrast') applyPrefs();
    if(f==='opt-awake'){ keepAwake(t.checked&&!!activeSession()); }
    if(f==='opt-timer'&&!t.checked) stopTimer();
    if(f==='opt-sound'&&t.checked) audio();
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&ev.target.id==='newex'){ ev.preventDefault(); var b=document.querySelector('[data-act="addex"]'); if(b) b.click(); }
});
setInterval(function(){
  var el=$('#elapsed'), a=activeSession(); if(el&&a) el.textContent=fmtDur(Date.now()-a.startedAt);
  tickTimer();
},250);
if(window.ResizeObserver){ try{ new ResizeObserver(syncDock).observe($('#dock')); }catch(e){} }
window.addEventListener('resize',syncDock);
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); installEvt=e; if(plan&&ui.tab==='plan'&&ui.ptab==='settings') render(); });
window.addEventListener('appinstalled',function(){ installEvt=null; announce('Lift Log installed'); });

(async function init(){
  if(!document.documentElement.lang) document.documentElement.lang='en';
  await initStore();
  await loadAll();
  var seed=seedPlan(), loaded=!!(plan&&Array.isArray(plan.days)), migrated=false;
  if(!loaded) plan=seed;
  else if(!plan.days.some(function(d){return /^w\d+$/.test(d.id)})){ plan.days=plan.days.concat(seed.days); migrated=true; }
  var upgraded=upgradePlan();
  if(loaded&&(upgraded||migrated)) schedule('plan',persistPlan,0);
  applyPrefs();
  render();
  if(activeSession()) keepAwake(true);
})();
})();
</script>

try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
